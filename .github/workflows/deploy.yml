name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write  # required for OIDC AWS auth
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        # NEXT_PUBLIC_* vars must be baked in at build time — they get compiled
        # into the browser bundle and cannot be changed at container runtime.
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/mirror-app"
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_SOCKET_URL="${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}" \
            --build-arg OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -t "$ECR:${{ github.sha }}" \
            -t "$ECR:latest" \
            .
          docker push "$ECR:${{ github.sha }}"
          docker push "$ECR:latest"

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/key && chmod 600 /tmp/key
          ssh -i /tmp/key -o StrictHostKeyChecking=no ubuntu@${{ secrets.FRONTEND_EC2_HOST }} \
            "set -e
             aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'
             docker pull '${{ steps.login-ecr.outputs.registry }}/mirror-app:${{ github.sha }}'
             docker stop mirror-app 2>/dev/null || true
             docker rm mirror-app 2>/dev/null || true
             docker run -d --name mirror-app --restart unless-stopped -p 3000:3000 '${{ steps.login-ecr.outputs.registry }}/mirror-app:${{ github.sha }}'
             docker image prune -f"
          rm -f /tmp/key
