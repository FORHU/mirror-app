name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: main

concurrency:
  group: style-os-mirror-app-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Push & Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write # required for OIDC AWS auth
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        # NEXT_PUBLIC_* vars must be baked in at build time — they get compiled
        # into the browser bundle and cannot be changed at container runtime.
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_COMPANION_URL: ${{ secrets.NEXT_PUBLIC_COMPANION_URL }}
          NEXT_PUBLIC_MIRROR_ID: ${{ secrets.NEXT_PUBLIC_MIRROR_ID }}
          NEXT_PUBLIC_KIOSK_DEVICE_SECRET: ${{ secrets.NEXT_PUBLIC_KIOSK_DEVICE_SECRET }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_DEVICE_MODE: ${{ secrets.NEXT_PUBLIC_DEVICE_MODE }}
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/mirror-app"
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg NEXT_PUBLIC_SOCKET_URL="${NEXT_PUBLIC_SOCKET_URL}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            --build-arg NEXT_PUBLIC_COMPANION_URL="${NEXT_PUBLIC_COMPANION_URL}" \
            --build-arg NEXT_PUBLIC_MIRROR_ID="${NEXT_PUBLIC_MIRROR_ID}" \
            --build-arg NEXT_PUBLIC_KIOSK_DEVICE_SECRET="${NEXT_PUBLIC_KIOSK_DEVICE_SECRET}" \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${NEXT_PUBLIC_MAPBOX_TOKEN}" \
            --build-arg NEXT_PUBLIC_DEVICE_MODE="${NEXT_PUBLIC_DEVICE_MODE}" \
            -t "$ECR:${{ github.sha }}" -t "$ECR:latest" .
          docker push "$ECR:${{ github.sha }}"
          docker push "$ECR:latest"

      - name: Write env file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: production
          PORT: 3000
        run: |
          cat > ${{ github.workspace }}/mirror-app.env << EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          EOF

      - name: Copy env file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.FRONTEND_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   mirror-app.env
          target:   /home/ubuntu/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.FRONTEND_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            chmod 600 /home/ubuntu/mirror-app.env
            aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/mirror-app:${{ github.sha }}
            docker stop mirror-app 2>/dev/null || true
            docker rm   mirror-app 2>/dev/null || true
            docker run -d --name mirror-app --restart unless-stopped \
              --env-file /home/ubuntu/mirror-app.env \
              -p 3000:3000 \
              ${{ steps.login-ecr.outputs.registry }}/mirror-app:${{ github.sha }}
            docker image prune -f
