name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: staging

concurrency:
  group: style-os-mirror-app-deploy-staging
  cancel-in-progress: true

env:
  ECR_REPOSITORY: style-os-mirror-app-staging
  AWS_REGION: ap-southeast-1
  NODE_ENV: staging
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build, Push & Deploy (staging)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_COMPANION_URL: ${{ secrets.NEXT_PUBLIC_COMPANION_URL }}
          NEXT_PUBLIC_MIRROR_ID: ${{ secrets.NEXT_PUBLIC_MIRROR_ID }}
          NEXT_PUBLIC_KIOSK_DEVICE_SECRET: ${{ secrets.NEXT_PUBLIC_KIOSK_DEVICE_SECRET }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_DEVICE_MODE: ${{ secrets.NEXT_PUBLIC_DEVICE_MODE }}
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg NEXT_PUBLIC_SOCKET_URL="${NEXT_PUBLIC_SOCKET_URL}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            --build-arg NEXT_PUBLIC_COMPANION_URL="${NEXT_PUBLIC_COMPANION_URL}" \
            --build-arg NEXT_PUBLIC_MIRROR_ID="${NEXT_PUBLIC_MIRROR_ID}" \
            --build-arg NEXT_PUBLIC_KIOSK_DEVICE_SECRET="${NEXT_PUBLIC_KIOSK_DEVICE_SECRET}" \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${NEXT_PUBLIC_MAPBOX_TOKEN}" \
            --build-arg NEXT_PUBLIC_DEVICE_MODE="${NEXT_PUBLIC_DEVICE_MODE}" \
            -t "$ECR:${{ env.IMAGE_TAG }}" -t "$ECR:latest" .
          docker push "$ECR:${{ env.IMAGE_TAG }}"
          docker push "$ECR:latest"

      - name: Write env file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: ${{ env.NODE_ENV }}
          PORT: 3000
        run: |
          cat > ${{ github.workspace }}/mirror-app.env << EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          EOF

      - name: Copy env file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   mirror-app.env
          target:   /home/ec2-user/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            chmod 600 /home/ec2-user/mirror-app.env
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            docker stop mirror-app 2>/dev/null || true
            docker rm   mirror-app 2>/dev/null || true
            docker run -d --name mirror-app --restart unless-stopped \
              --env-file /home/ec2-user/mirror-app.env \
              -p 3000:3000 \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            docker image prune -f
