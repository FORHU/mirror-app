name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Placeholder values so Next.js build doesn't fail without real secrets
          NEXT_PUBLIC_DEVICE_MODE: mirror
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3007
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3007
          NEXT_PUBLIC_MAPBOX_TOKEN: ci_placeholder
          OPENAI_API_KEY: ci_placeholder
          NEXT_TELEMETRY_DISABLED: 1
